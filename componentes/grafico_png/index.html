<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  iframe { border: 0; width: 100%; display: block; }
</style>
</head>
<body>
<!-- Muestra el gráfico (HTML recibido desde Python) y devuelve a Streamlit un PNG
     de la vista actual (#captureRoot), para adjuntarlo al ticket. -->
<iframe id="grafico"></iframe>
<script>
const marco = document.getElementById('grafico');
let htmlActual = null, temporizador = null, ultimoPng = null;

function enviar(tipo, datos) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: tipo }, datos), '*');
}

function capturar() {
  const w = marco.contentWindow;
  const raiz = w && w.document.getElementById('captureRoot');
  if (!raiz || !w.html2canvas) {   // html2canvas aún cargando
    temporizador = setTimeout(capturar, 800);
    return;
  }
  w.html2canvas(raiz, { backgroundColor: '#ffffff', scale: 1.5, logging: false })
    .then(canvas => {
      if (!canvas.width || !canvas.height) {   // pestaña oculta: reintentar más tarde
        temporizador = setTimeout(capturar, 2000);
        return;
      }
      const png = canvas.toDataURL('image/png');
      if (png !== ultimoPng) {
        ultimoPng = png;
        enviar('streamlit:setComponentValue', { value: { png: png, ts: Date.now() }, dataType: 'json' });
      }
    })
    .catch(() => {});
}

// Captura con retardo: espera a que termine de dibujar / de navegar
function programarCaptura() {
  clearTimeout(temporizador);
  temporizador = setTimeout(capturar, 1200);
}

window.addEventListener('message', ev => {
  const d = ev.data;
  if (!d || d.type !== 'streamlit:render') return;
  const args = d.args || {};
  if (args.html !== htmlActual) {
    htmlActual = args.html;
    marco.style.height = args.height + 'px';
    marco.srcdoc = args.html;
  }
  enviar('streamlit:setFrameHeight', { height: args.height });
});

marco.addEventListener('load', () => {
  programarCaptura();
  // Navegación del calendario, series activadas, etc.
  marco.contentDocument.addEventListener('click', programarCaptura, true);
});

enviar('streamlit:componentReady', { apiVersion: 1 });
</script>
</body>
</html>
